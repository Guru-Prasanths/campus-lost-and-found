version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campus-lostfound-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: campus_lost_found
      MYSQL_USER: ${MYSQL_USER:-campususer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campuspassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: campus-lostfound-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_lost_found?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-campususer}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-campuspassword}
      PORT: 8080
    volumes:
      - app-uploads:/app/uploads/items

volumes:
  mysql-data:
  app-uploads:

