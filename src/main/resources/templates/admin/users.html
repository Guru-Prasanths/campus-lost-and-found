<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Manage Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Panel</div>
        </div>
        <nav class="admin-nav">
            <a th:href="@{/admin}" class="admin-nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a th:href="@{/admin/items}" class="admin-nav-item"><i class="fas fa-boxes"></i> Manage Items</a>
            <a th:href="@{/admin/claims}" class="admin-nav-item"><i class="fas fa-clipboard-list"></i> Manage Claims</a>
            <a th:href="@{/admin/users}" class="admin-nav-item active"><i class="fas fa-users"></i> Manage Users</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="admin-page-header">
            <div th:replace="~{fragments/layout :: flash-messages}"></div>
            <h1 class="admin-page-title"><i class="fas fa-users"></i> Manage Users</h1>
        </div>

        <div class="admin-table-card">
            <table class="admin-table admin-table-full">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>College ID</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td><strong th:text="${user.fullName}">Name</strong></td>
                        <td th:text="${user.collegeId}">ID</td>
                        <td th:text="${user.email}">Email</td>
                        <td>
                            <span class="role-badge" th:classappend="'role-' + ${user.role.name().toLowerCase()}"
                                  th:text="${user.role.name()}">STUDENT</span>
                        </td>
                        <td th:text="${user.department ?: '-'}">Dept</td>
                        <td>
                            <span th:if="${user.enabled}" class="status-dot status-active">Active</span>
                            <span th:unless="${user.enabled}" class="status-dot status-inactive">Disabled</span>
                        </td>
                        <td th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</td>
                        <td>
                            <div class="action-buttons">
                                <form th:action="@{'/admin/users/' + ${user.id} + '/toggle'}" method="post" style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-xs"
                                            th:classappend="${user.enabled} ? 'btn-warning' : 'btn-success'"
                                            th:text="${user.enabled} ? 'Disable' : 'Enable'">Toggle</button>
                                </form>
                                <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post" style="display:inline"
                                      th:unless="${user.role.name() == 'ADMIN'}">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-xs btn-danger"
                                            onclick="return confirm('Delete this user? This cannot be undone.')">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
