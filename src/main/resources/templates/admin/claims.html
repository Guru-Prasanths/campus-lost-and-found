<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Manage Claims')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Panel</div>
        </div>
        <nav class="admin-nav">
            <a th:href="@{/admin}" class="admin-nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a th:href="@{/admin/items}" class="admin-nav-item"><i class="fas fa-boxes"></i> Manage Items</a>
            <a th:href="@{/admin/claims}" class="admin-nav-item active"><i class="fas fa-clipboard-list"></i> Manage Claims</a>
            <a th:href="@{/admin/users}" class="admin-nav-item"><i class="fas fa-users"></i> Manage Users</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="admin-page-header">
            <div th:replace="~{fragments/layout :: flash-messages}"></div>
            <h1 class="admin-page-title"><i class="fas fa-clipboard-list"></i> Manage Claims</h1>
        </div>

        <!-- Status Filter -->
        <div class="admin-filter-bar">
            <a th:href="@{/admin/claims}" class="filter-tab" th:classappend="${selectedStatus == null} ? 'active'">All</a>
            <a th:each="status : ${claimStatuses}"
               th:href="@{/admin/claims(status=${status.name()})}"
               class="filter-tab"
               th:classappend="${selectedStatus != null and selectedStatus.name() == status.name()} ? 'active'"
               th:text="${status.name()}">Status</a>
        </div>

        <div class="admin-table-card">
            <div th:if="${claims.empty}" class="admin-empty">
                <i class="fas fa-clipboard"></i>
                <p>No claims found</p>
            </div>
            <table class="admin-table admin-table-full" th:unless="${claims.empty}">
                <thead>
                    <tr>
                        <th>Claim ID</th>
                        <th>Claimant</th>
                        <th>Item</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="claim : ${claims.content}">
                        <td><strong>#<span th:text="${claim.id}">0</span></strong></td>
                        <td>
                            <div class="table-user">
                                <strong th:text="${claim.claimant.fullName}">Name</strong>
                                <small th:text="${claim.claimant.collegeId}">ID</small>
                            </div>
                        </td>
                        <td>
                            <a th:href="@{'/items/' + ${claim.item.id}}" class="table-link" th:text="${claim.item.itemName}">Item</a>
                            <small th:classappend="${claim.item.itemType.name() == 'LOST'} ? 'text-danger' : 'text-success'"
                                   th:text="${claim.item.itemType.name()}">TYPE</small>
                        </td>
                        <td>
                            <span class="status-badge status-sm" th:classappend="'claim-status-' + ${claim.status.name().toLowerCase()}"
                                  th:text="${claim.status.name()}">PENDING</span>
                        </td>
                        <td th:text="${#temporals.format(claim.createdAt, 'MMM dd, yyyy')}">Date</td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{'/claims/' + ${claim.id}}" class="btn btn-xs btn-outline">View</a>
                                <form th:if="${claim.status.name() == 'PENDING' or claim.status.name() == 'UNDER_REVIEW'}"
                                      th:action="@{'/admin/claims/' + ${claim.id} + '/approve'}" method="post" style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-xs btn-success" onclick="return confirm('Approve claim?')">Approve</button>
                                </form>
                                <form th:if="${claim.status.name() == 'PENDING' or claim.status.name() == 'UNDER_REVIEW'}"
                                      th:action="@{'/admin/claims/' + ${claim.id} + '/reject'}" method="post" style="display:inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-xs btn-danger" onclick="return confirm('Reject claim?')">Reject</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrap" th:if="${claims.totalPages > 1}">
            <div class="pagination">
                <a class="page-btn" th:if="${claims.number > 0}"
                   th:href="@{/admin/claims(page=${claims.number - 1}, status=${selectedStatus})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <span class="page-info">Page <strong th:text="${claims.number + 1}">1</strong> of <strong th:text="${claims.totalPages}">1</strong></span>
                <a class="page-btn" th:if="${claims.number < claims.totalPages - 1}"
                   th:href="@{/admin/claims(page=${claims.number + 1}, status=${selectedStatus})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
