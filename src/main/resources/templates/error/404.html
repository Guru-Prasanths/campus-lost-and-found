<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page Not Found')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page or item you are looking for does not exist or may have been moved.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
            <a th:href="@{/items}" class="btn btn-outline"><i class="fas fa-search"></i> Browse Items</a>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
