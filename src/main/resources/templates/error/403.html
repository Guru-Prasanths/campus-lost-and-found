<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container error-page">
    <div class="error-content">
        <div class="error-code">403</div>
        <h1 class="error-title">Access Denied</h1>
        <p class="error-desc">You do not have permission to access this page. If you believe this is an error, please contact the administrator.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
            <a th:href="@{/dashboard}" class="btn btn-outline"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
